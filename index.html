<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <meta name="description" content="Alva — lanterna de tela com modos SOS e strobe." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alva" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <title>Alva</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Alva">
          <span class="brand-mark" aria-hidden="true">A</span>
          <h1>Alva</h1>
        </div>
        <div class="header-actions">
          <button id="installBtn" class="icon-button hidden" type="button" aria-label="Instalar Alva" title="Instalar Alva">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3" /></svg>
          </button>
          <button id="exitBtn" class="icon-button" type="button" aria-label="Sair do Alva" title="Sair">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5m5-4 4-4-4-4m4 4H9" /></svg>
          </button>
        </div>
      </header>

      <span id="networkStatus" class="network-indicator offline" role="img" aria-label="Internet offline" title="Internet offline">
        <svg class="wifi-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12a10.5 10.5 0 0 1 14 0m-11 3.2a5.5 5.5 0 0 1 8 0M12 19h.01" /></svg>
        <svg class="wifi-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 2 20 20M8.5 5.2A15.5 15.5 0 0 1 22 8.8M5 12a10.5 10.5 0 0 1 4-2.2m4.5.5a10.5 10.5 0 0 1 5.5 3.2m-11 3.2a5.5 5.5 0 0 1 8 0M12 21h.01" /></svg>
      </span>

      <main class="scene">
        <div class="torch-glow" aria-hidden="true"></div>
        <button id="powerBtn" class="power-button" type="button" aria-label="Ligar lanterna" title="Ligar lanterna">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m6.36-6.36a9 9 0 1 1-12.72 0" /></svg>
        </button>

        <section class="controls-panel" aria-label="Controles da lanterna">
          <div class="mode-group" aria-label="Modo de luz">
            <button class="mode-btn active" data-mode="torch" type="button" aria-label="Modo lanterna" title="Lanterna" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l1 5-2 2v8l-3 3-3-3v-8L7 8l1-5Zm1 5h6m-5 4h4" /></svg>
            </button>
            <button class="mode-btn" data-mode="sos" type="button" aria-label="Modo SOS" title="SOS" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 20h18L12 3Zm0 6v5m0 3h.01" /></svg>
            </button>
            <button class="mode-btn" data-mode="strobe" type="button" aria-label="Modo strobe" title="Strobe" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-13h-7l1-7Z" /></svg>
            </button>
          </div>

          <label class="slider-wrap" for="intensityRange">
            <span class="slider-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42M9 16h6l-1-2.5a4 4 0 1 0-4 0L9 16Zm1 2h4m-3 2h2" /></svg><span>Intensidade</span><strong id="brightnessValue">85%</strong></span>
            <input id="intensityRange" type="range" min="10" max="100" value="85" />
          </label>

          <div class="utility-row">
            <button id="vibrateBtn" class="icon-button utility-btn" type="button" aria-label="Ativar vibração" title="Vibração" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V5Zm-4 2v10m16-10v10M1 9v6m22-6v6" /></svg>
            </button>
            <button id="soundBtn" class="icon-button utility-btn" type="button" aria-label="Ativar som" title="Som" aria-pressed="false">
              <svg class="sound-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 4 5 6m0-6-5 6" /></svg>
              <svg class="sound-on-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /></svg>
            </button>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
