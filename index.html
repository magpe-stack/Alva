<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <meta name="description" content="Alva — lanterna PWA com modos SOS e strobe." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alva" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <title>Alva</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">A</div>
          <div><p class="eyebrow">Lanterna PWA</p><h1>Alva</h1></div>
        </div>
        <div class="header-actions">
          <button id="installBtn" class="ghost-button hidden" type="button">Instalar</button>
          <button id="exitBtn" class="ghost-button exit-button" type="button">Sair</button>
        </div>
      </header>

      <main class="scene" aria-live="polite">
        <div class="torch-glow" aria-hidden="true"></div>
        <div class="status-card">
          <div class="status-heading">
            <p class="status-label">Status</p>
            <div class="status-icons" aria-label="Estado dos dispositivos">
              <span class="status-icon camera-off" role="img" aria-label="Câmera desligada" title="Câmera desligada">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10a2 2 0 0 1 2 2v1l4-3v10l-4-3v1a2 2 0 0 1-2 2H6M3 3l18 18" /></svg>
              </span>
              <span id="networkStatus" class="status-icon" role="img" aria-label="Internet offline" title="Internet offline">
                <svg class="wifi-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12a10.5 10.5 0 0 1 14 0m-11 3.2a5.5 5.5 0 0 1 8 0M12 19h.01" /></svg>
                <svg class="wifi-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 2 20 20M8.5 5.2A15.5 15.5 0 0 1 22 8.8M5 12a10.5 10.5 0 0 1 4-2.2m4.5.5a10.5 10.5 0 0 1 5.5 3.2m-11 3.2a5.5 5.5 0 0 1 8 0M12 21h.01" /></svg>
              </span>
            </div>
          </div>
          <h2 id="statusText">Desligada</h2>
        </div>

        <button id="powerBtn" class="power-button" type="button" aria-label="Ligar ou desligar lanterna">
          <span class="power-icon" aria-hidden="true">◉</span>
        </button>

        <div class="controls-panel">
          <div class="mode-group" aria-label="Escolha o modo da lanterna">
            <button class="mode-btn active" data-mode="torch" type="button" aria-pressed="true">Lanterna</button>
            <button class="mode-btn" data-mode="sos" type="button" aria-pressed="false">SOS</button>
            <button class="mode-btn" data-mode="strobe" type="button" aria-pressed="false">Strobe</button>
          </div>
          <label class="slider-wrap" for="intensityRange">
            <span>Intensidade</span>
            <input id="intensityRange" type="range" min="10" max="100" value="85" />
            <strong id="brightnessValue">85%</strong>
          </label>
          <div class="utility-row">
            <button id="vibrateBtn" class="utility-btn" type="button" aria-pressed="false">Vibração: desligada</button>
            <button id="soundBtn" class="utility-btn" type="button" aria-pressed="false">Som: desligado</button>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
